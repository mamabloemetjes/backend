root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/server ."
  bin = "./tmp/server"
  full_bin = ""
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "uploads", "vendor", "node_modules", ".git"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
