services:
  mamabloemetjes:
    networks:
      - mamabloemetjes-net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mamabloemetjes
    env_file:
      - .env
    volumes:
      - .env:/app/.env:ro
      - /srv/mamabloemetjes/originals:/app/originals
      - /srv/mamabloemetjes/uploads:/app/uploads
    ports:
      - "8081:8081"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    dns:
      - 8.8.8.8
      - 8.8.4.4 # optional backup DNS

networks:
  mamabloemetjes-net:
    external: true
